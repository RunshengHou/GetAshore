<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上岸学习数据看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">S</div>
          <div>
            <div class="brand-label">数据中心</div>
            <div class="brand-name">上岸学习台账</div>
          </div>
        </div>

        <nav class="nav-menu">
          <div class="nav-section-title">看板</div>
          <button class="nav-item active" type="button" data-view="overview">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="4" rx="1.5"></rect>
                <rect x="14" y="11" width="7" height="10" rx="1.5"></rect>
                <rect x="3" y="12" width="7" height="9" rx="1.5"></rect>
              </svg>
            </span>
            今日总体看板
          </button>
          <button class="nav-item" type="button" data-view="profile">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            个人看板
          </button>
          <button class="nav-item" type="button" data-view="table">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
                <path d="M8 4v16"></path>
                <path d="M16 4v16"></path>
              </svg>
            </span>
            表格数据页
          </button>
          <button class="nav-item" type="button" data-view="form">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"></path>
              </svg>
            </span>
            提交表单
          </button>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">数据监控</p>
            <h1 id="pageTitle">今日总体看板</h1>
          </div>
          <div class="topbar-actions">
            <button class="ghost-btn" id="refreshDataBtn" type="button">刷新数据</button>
          </div>
        </header>

        <main class="content-area">
          <section class="view-section active" data-view="overview">
            <section class="summary-grid" id="summaryGrid"></section>

            <section class="panel-grid two-col">
              <article class="panel">
                <div class="panel-header">
                  <h2>刷题活跃热力图</h2>
                </div>
                <div id="heatmap" class="heatmap"></div>
              </article>

              <article class="panel">
                <div class="panel-header">
                  <h2>模块正确率对比</h2>
                </div>
                <div class="chart-wrap chart-wrap--radar">
                  <canvas id="radarChart"></canvas>
                </div>
              </article>
            </section>

            <section class="panel-grid two-col">
              <article class="panel">
                <div class="panel-header">
                  <h2>每日刷题趋势</h2>
                </div>
                <div class="chart-wrap">
                  <canvas id="lineChart"></canvas>
                </div>
              </article>

              <article class="panel">
                <div class="panel-header">
                  <h2>今日刷题量对比</h2>
                </div>
                <div class="chart-wrap">
                  <canvas id="barChart"></canvas>
                </div>
              </article>
            </section>
          </section>

          <section class="view-section" data-view="profile">
            <section class="panel personal-panel">
              <div class="panel-header">
                <h2>个人看板</h2>
              </div>

              <div class="profile-overview" id="profileOverview"></div>

              <div class="module-grid" id="moduleGrid"></div>
            </section>
          </section>

          <section class="view-section" data-view="table">
            <section class="panel table-panel">
              <div class="panel-header table-header">
                <h2>学习记录表</h2>
                <div class="table-filters">
                  <select id="personFilter">
                    <option value="all">全部人物</option>
                  </select>
                  <select id="moduleFilter">
                    <option value="all">全部模块</option>
                  </select>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>日期</th>
                      <th>人物</th>
                      <th>题目类型</th>
                      <th>题目数量</th>
                      <th>正确数量</th>
                      <th>正确率</th>
                      <th>完成时长</th>
                      <th>平均用时</th>
                    </tr>
                  </thead>
                  <tbody id="recordTableBody"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section class="view-section" data-view="form">
            <section class="panel form-panel">
              <div class="panel-header">
                <h2>新增学习记录</h2>
              </div>
              <form id="recordForm" class="record-form">
                <div class="form-grid">
                  <label>
                    <span>日期</span>
                    <input type="date" id="recordDate" required />
                  </label>
                  <label>
                    <span>人物</span>
                    <select id="recordPerson" required></select>
                  </label>
                  <label>
                    <span>题目类型</span>
                    <select id="recordModule" required></select>
                  </label>
                  <label>
                    <span>题目数量</span>
                    <input type="number" id="questionCount" min="1" required />
                  </label>
                  <label>
                    <span>正确数量</span>
                    <input type="number" id="correctCount" min="0" required />
                  </label>
                  <label>
                    <span>完成时长（分钟）</span>
                    <input type="number" id="durationMinutes" min="1" required />
                  </label>
                </div>
                <div class="form-actions">
                  <button type="submit" class="primary-btn">提交记录</button>
                  <span id="formMessage" class="form-message"></span>
                </div>
              </form>
            </section>
          </section>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
